name: Apply P5.3 validation harness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p53-validation.yml'
      - 'tools/p53_apply.py'
      - 'tests/SmartDenoiseProductTests.cpp'
      - 'tests/SmartDenoiseListeningHarness.cpp'
      - 'qa/verify_p53_validation.py'
      - 'Source/Plugin/PluginProcessor.h'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply P5.3 source and build harness
        run: python tools/p53_apply.py
      - name: Validate patch shape
        run: |
          python qa/verify_p0_p2_contract.py
          python qa/verify_p3_source.py
          git diff --check
      - name: Commit P5.3 source harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/p53_apply.py
          git add Source/Plugin/PluginProcessor.cpp CMakeLists.txt CHANGELOG.md
          git diff --cached --check
          git commit -m 'P5.3: add real workflow and listening validation harness'
          git push origin HEAD:agent/ship-v0.3-rc
