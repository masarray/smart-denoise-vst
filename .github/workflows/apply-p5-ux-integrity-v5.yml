name: Apply P5 UX integrity v5

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p5-ux-integrity-v5.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-p5:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Prepare robust P5 patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_p5_ux_integrity.py'); s=p.read_text(encoding='utf-8')
          old="s = replace_once(s, '''            captureBounds.getWidth() - 82,\\n            26);\\n''', '''            captureBounds.getWidth() - 64,\\n            26);\\n''', 'profile name width')"
          new="s = replace_once(s, 'captureBounds.getWidth() - 82', 'captureBounds.getWidth() - 64', 'profile name width')"
          if old not in s: raise SystemExit('profile anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY

      - name: Apply exact P5 UX integrity patch
        run: python tools/apply_p5_ux_integrity.py

      - name: Migrate QA selectors and discard bot workflow edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('qa/verify_p4_visual_fidelity.py'); s=p.read_text(encoding='utf-8')
          old='check("Advanced drawer uses two-column split", "advancedBounds.getCentreX()" in editor_cpp and \'"PROCESSING"\' in editor_cpp and \'"NOISE PROFILE"\' in editor_cpp)'
          new='check("P5 advanced drawer uses two-column split", "advancedBounds.getCentreX()" in editor_cpp and \'"PROCESSING"\' in editor_cpp and \'"PROFILE STATUS"\' in editor_cpp)'
          if old not in s: raise SystemExit('stale P4 assertion missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')

          p=Path('qa/verify_p5_ux_integrity.py'); s=p.read_text(encoding='utf-8')
          old='activity = cpp[cpp.index("drawActivityStrip"):cpp.index("drawFooter")]\nadvanced = cpp[cpp.index("drawAdvancedDrawer"):cpp.index("drawTelemetry")]'
          new='activity_start = cpp.index("void SmartDenoiseAudioProcessorEditor::\\ndrawActivityStrip")\nactivity_end = cpp.index("void SmartDenoiseAudioProcessorEditor::\\ndrawFooter", activity_start)\nactivity = cpp[activity_start:activity_end]\nadvanced_start = cpp.index("void SmartDenoiseAudioProcessorEditor::\\ndrawAdvancedDrawer")\nadvanced_end = cpp.index("void SmartDenoiseAudioProcessorEditor::\\ndrawTelemetry", advanced_start)\nadvanced = cpp[advanced_start:advanced_end]'
          if old not in s: raise SystemExit('P5 selector anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          git checkout -- .github/workflows/source-audit.yml .github/workflows/release.yml

      - name: Validate P4 and P5
        run: |
          python qa/verify_p4_visual_fidelity.py
          python qa/verify_p5_ux_integrity.py
          git diff --check

      - name: Commit P5 source and QA only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_p5_ux_integrity.py
          git add Source/Plugin/PluginEditor.cpp Source/Plugin/PluginEditor.h qa/verify_p4_visual_fidelity.py qa/verify_p5_ux_integrity.py CHANGELOG.md
          git diff --cached --check
          git commit -m 'P5: enforce UX integrity and professional interactions'
          git push origin HEAD:agent/ship-v0.3-rc
