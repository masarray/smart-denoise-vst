name: Apply P5.3 broadband Learn correction

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p53-broadband-learning.yml'
      - 'tools/p53_fix_broadband_learning.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply broadband Learn correction
        run: python tools/p53_fix_broadband_learning.py
      - name: Validate contracts
        run: |
          python qa/verify_p0_p2_contract.py
          python qa/verify_p3_source.py
          python qa/verify_p53_validation.py
          git diff --check
      - name: Commit final correction and remove one-shot machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-p53-broadband-learning.yml tools/p53_fix_broadband_learning.py
          git add Source/DSP/SmartDenoiseEngine.cpp tests/SmartDenoiseTests.cpp tests/SmartDenoiseListeningHarness.cpp qa/verify_p53_validation.py
          git diff --cached --check
          git commit -m 'P5.3: accept stable broadband noise during Learn'
          git push origin HEAD:agent/ship-v0.3-rc
