name: Apply P4.4 flat machined knob renderer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p44-flat-knobs.yml'
      - 'tools/apply_p44_flat_knobs.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-p44:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply exact P4.4 flat knob patch
        run: python tools/apply_p44_flat_knobs.py

      - name: Replace obsolete P4.3 dome assertions with P4.4 material assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('qa/verify_p4_visual_fidelity.py')
          s = p.read_text(encoding='utf-8')
          old = '''check("P4.3 physical knob shadow", "auto knobShadow =" in editor_cpp and "fillEllipse (knobShadow)" in editor_cpp)
          check("P4.3 metallic bezel", "auto metalBezel =" in editor_cpp and "bezelGradient" in editor_cpp)
          check("P4.3 inner bevel depth", "auto innerRim =" in editor_cpp and "rimGradient" in editor_cpp)
          check("P4.3 glossy specular reflection", "auto specularGlow =" in editor_cpp and "specularGradient" in editor_cpp)
          check("P4.3 dimensional marker", "auto markerShadow =" in editor_cpp and "auto markerBezel =" in editor_cpp)
          '''
          new = '''check("P4.4 recessed hardware well", "auto recess =" in editor_cpp and "recessGradient" in editor_cpp)
          check("P4.4 narrow machined bezel", "auto bezel =" in editor_cpp and "bezelGradient" in editor_cpp)
          check("P4.4 flat face rim", "auto faceRim =" in editor_cpp and "fillEllipse (faceRim)" in editor_cpp)
          check("P4.4 brushed radial texture", "constexpr int spokeCount = 92" in editor_cpp and "faceClip.addEllipse" in editor_cpp)
          check("P4.4 restrained top sheen", "auto sheen =" in editor_cpp and "sheenGradient" in editor_cpp)
          '''
          if old not in s:
              raise SystemExit('obsolete P4.3 contract block not found')
          s = s.replace(old, new, 1)
          s = s.replace('SMART DENOISE P4.3 PREMIUM 3D KNOB CONTRACT', 'SMART DENOISE P4.4 FLAT MACHINED KNOB CONTRACT')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Validate P4 visual contract
        run: python qa/verify_p4_visual_fidelity.py

      - name: Validate diff
        run: git diff --check

      - name: Commit final P4.4 source and remove one-shot machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-p44-flat-knobs.yml tools/apply_p44_flat_knobs.py
          git add Source/Plugin/PluginEditor.cpp qa/verify_p4_visual_fidelity.py CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'P4.4: switch knobs to flat machined-disc style'
          git push origin HEAD:agent/ship-v0.3-rc
