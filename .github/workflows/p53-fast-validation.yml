name: P5.3 Fast Validation

on:
  push:
    branches:
      - "agent/**"
    paths:
      - 'tests/SmartDenoiseListeningHarness.cpp'
      - 'tests/SmartDenoiseProductTests.cpp'
      - 'Source/DSP/**'
      - 'Source/Plugin/PluginProcessor.*'
      - 'CMakeLists.txt'
      - '.github/workflows/p53-fast-validation.yml'
  pull_request:
    paths:
      - 'tests/SmartDenoiseListeningHarness.cpp'
      - 'tests/SmartDenoiseProductTests.cpp'
      - 'Source/DSP/**'
      - 'Source/Plugin/PluginProcessor.*'
      - 'CMakeLists.txt'
      - '.github/workflows/p53-fast-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Configure tests only
        shell: pwsh
        run: cmake -S . -B build -A x64 -DSMART_DENOISE_BUILD_TESTS=ON
      - name: Build validation targets
        shell: pwsh
        run: |
          cmake --build build --config Release --target SmartDenoiseTests SmartDenoiseProductTests SmartDenoiseListeningHarness --parallel 2
      - name: Engine + product workflow
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Listening harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force listening-validation | Out-Null
          $harness = Get-ChildItem -Path build -Recurse -File -Filter 'Smart Denoise Listening Harness.exe' | Select-Object -First 1
          if ($null -eq $harness) { throw 'Listening harness executable missing' }
          & $harness.FullName "$PWD/listening-validation"
          $code = $LASTEXITCODE
          Get-ChildItem -Path listening-validation -Recurse -Force | ForEach-Object { Write-Host $_.FullName }
          if ($code -ne 0) { throw "Listening harness failed with exit code $code" }
          if (-not (Test-Path 'listening-validation/metrics.csv')) { throw 'metrics.csv missing' }
      - name: Upload listening diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: P5.3-fast-listening-diagnostics
          path: listening-validation/**
          if-no-files-found: warn
          retention-days: 7
