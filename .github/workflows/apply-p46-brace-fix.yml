name: Apply P4.6 brace fix
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p46-brace-fix.yml'
      - 'tools/fix_p46_brace.py'
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tools/fix_p46_brace.py
      - run: python qa/verify_p4_visual_fidelity.py
      - run: git diff --check
      - name: Commit fix and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-p46-brace-fix.yml tools/fix_p46_brace.py
          git add Source/Plugin/PluginEditor.cpp
          git commit -m 'P4.6: restore machining scope brace'
          git push origin HEAD:agent/ship-v0.3-rc
