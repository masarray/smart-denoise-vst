name: Apply P5.2 profile workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p52-profile-workflow.yml'
      - 'tools/p52_engine.py'
      - 'tools/p52_processor.py'
      - 'tools/p52_editor.py'
      - 'qa/verify_p52_profile_workflow.py'
      - 'qa/verify_concept_c_ui.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply P5.2 engine fingerprint
        run: python tools/p52_engine.py
      - name: Apply P5.2 persistent profile bank
        run: python tools/p52_processor.py
      - name: Apply P5.2 UX workflow
        run: python tools/p52_editor.py
      - name: Validate P0-P5.2 contracts
        run: |
          python qa/verify_p0_p2_contract.py
          python qa/verify_p2_math.py
          python qa/verify_p3_source.py
          python qa/verify_p3_math.py
          python qa/verify_concept_c_ui.py
          python qa/verify_p4_visual_fidelity.py
          python qa/verify_p5_ux_integrity.py
          python qa/verify_p52_profile_workflow.py
          git diff --check
      - name: Commit final P5.2 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/p52_engine.py tools/p52_processor.py tools/p52_editor.py
          git add Source tests qa/verify_p52_profile_workflow.py
          git diff --cached --check
          git commit -m 'P5.2: add captured profile bank and spectral workflow'
          git push origin HEAD:agent/ship-v0.3-rc
