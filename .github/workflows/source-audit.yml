name: Smart Denoise CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Source + math QA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate P0-P2 source contract
        run: python qa/verify_p0_p2_contract.py

      - name: Validate P2 mathematical behavior
        run: python qa/verify_p2_math.py

      - name: Validate P3 source contract
        run: python qa/verify_p3_source.py

      - name: Validate P3 behavior model
        run: python qa/verify_p3_math.py

      - name: Validate Concept C UI contract
        run: python qa/verify_concept_c_ui.py

      - name: Validate P4 visual fidelity contract
        run: python qa/verify_p4_visual_fidelity.py

      - name: Validate P5 UX integrity contract
        run: python qa/verify_p5_ux_integrity.py

  windows-build:
    name: Windows VST3 + Standalone + pluginval
    needs: source-audit
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DSMART_DENOISE_BUILD_TESTS=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Engine black-box tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Locate build products
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory |
            Where-Object { $_.Name -eq 'Smart Denoise.vst3' } |
            Select-Object -First 1

          $standalone = Get-ChildItem -Path build -Recurse -File -Filter 'Smart Denoise.exe' |
            Where-Object { $_.FullName -match 'Standalone' } |
            Select-Object -First 1

          if ($null -eq $vst) { throw 'Smart Denoise.vst3 was not produced' }
          if ($null -eq $standalone) { throw 'Smart Denoise Standalone executable was not produced' }

          "VST_PATH=$($vst.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STANDALONE_PATH=$($standalone.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "VST3: $($vst.FullName)"
          Write-Host "Standalone: $($standalone.FullName)"

      - name: Capture mandatory P5.1 runtime visual
        id: ui_capture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ui-snapshot | Out-Null

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class SmartDenoiseWin32 {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }

              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hWnd);

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
          }
          "@

          Add-Type -AssemblyName System.Drawing

          $process = Start-Process -FilePath "$env:STANDALONE_PATH" -PassThru
          try {
            Start-Sleep -Seconds 7
            $process.Refresh()

            if ($process.HasExited) {
              throw "Standalone exited before visual capture with code $($process.ExitCode)"
            }

            $windows = [System.Collections.Generic.List[object]]::new()
            $callback = [SmartDenoiseWin32+EnumWindowsProc] {
              param([IntPtr] $hWnd, [IntPtr] $lParam)

              [uint32] $windowProcessId = 0
              [SmartDenoiseWin32]::GetWindowThreadProcessId($hWnd, [ref] $windowProcessId) | Out-Null

              if ($windowProcessId -eq [uint32] $process.Id -and [SmartDenoiseWin32]::IsWindowVisible($hWnd)) {
                $candidateRect = New-Object SmartDenoiseWin32+RECT
                if ([SmartDenoiseWin32]::GetWindowRect($hWnd, [ref] $candidateRect)) {
                  $candidateWidth = $candidateRect.Right - $candidateRect.Left
                  $candidateHeight = $candidateRect.Bottom - $candidateRect.Top
                  if ($candidateWidth -gt 0 -and $candidateHeight -gt 0) {
                    $windows.Add([pscustomobject]@{
                      Handle = $hWnd
                      Rect = $candidateRect
                      Width = $candidateWidth
                      Height = $candidateHeight
                      Area = $candidateWidth * $candidateHeight
                    })
                  }
                }
              }

              return $true
            }

            [SmartDenoiseWin32]::EnumWindows($callback, [IntPtr]::Zero) | Out-Null

            $target = $windows |
              Where-Object { $_.Width -ge 800 -and $_.Height -ge 500 } |
              Sort-Object Area -Descending |
              Select-Object -First 1

            if ($null -eq $target) {
              $diagnostic = ($windows | Sort-Object Area -Descending | ForEach-Object { "$($_.Width)x$($_.Height)" }) -join ', '
              throw "No plugin-sized Standalone window found. Visible process windows: $diagnostic"
            }

            $pngPath = Join-Path $PWD 'ui-snapshot/Smart-Denoise-P5.1-runtime.png'
            $bitmap = New-Object System.Drawing.Bitmap($target.Width, $target.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($target.Rect.Left, $target.Rect.Top, 0, 0, $bitmap.Size)
              $bitmap.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            if (-not (Test-Path $pngPath)) {
              throw 'Runtime screenshot PNG was not created'
            }

            $pngFile = Get-Item $pngPath
            if ($pngFile.Length -lt 10000) {
              throw "Runtime screenshot is unexpectedly small: $($pngFile.Length) bytes"
            }

            $image = [System.Drawing.Image]::FromFile($pngPath)
            try {
              if ($image.Width -lt 800 -or $image.Height -lt 500) {
                throw "Runtime screenshot dimensions are invalid: $($image.Width)x$($image.Height)"
              }
              Write-Host "Runtime visual captured: $($image.Width)x$($image.Height), $($pngFile.Length) bytes"
            } finally {
              $image.Dispose()
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Download pluginval 1.0.4
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' `
            -OutFile pluginval.zip

          Expand-Archive pluginval.zip -DestinationPath pluginval -Force

          $pluginval = Get-ChildItem -Path pluginval -Recurse -File -Filter pluginval.exe |
            Select-Object -First 1

          if ($null -eq $pluginval) { throw 'pluginval.exe not found in downloaded archive' }
          "PLUGINVAL_PATH=$($pluginval.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null

          $arguments = @(
            '--validate-in-process',
            '--strictness-level', '5',
            '--skip-gui-tests',
            '--output-dir', ('"' + "$PWD/pluginval-logs" + '"'),
            ('"' + "$env:VST_PATH" + '"')
          )

          $process = Start-Process `
            -FilePath "$env:PLUGINVAL_PATH" `
            -ArgumentList $arguments `
            -NoNewWindow `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "pluginval failed with exit code $($process.ExitCode)"
          }

      - name: Package CI artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse -Force "$env:VST_PATH" package/
          Copy-Item -Force "$env:STANDALONE_PATH" package/

          Compress-Archive `
            -Path package/* `
            -DestinationPath Smart-Denoise-Windows-CI.zip `
            -Force

          if (-not (Test-Path 'ui-snapshot/Smart-Denoise-P5.1-runtime.png')) {
            throw 'Mandatory P5.1 runtime screenshot missing before artifact upload'
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Smart-Denoise-Windows-CI
          path: |
            Smart-Denoise-Windows-CI.zip
            pluginval-logs/**
            ui-snapshot/Smart-Denoise-P5.1-runtime.png
          if-no-files-found: error
          retention-days: 14
