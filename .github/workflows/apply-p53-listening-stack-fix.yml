name: Apply P5.3 listening harness heap fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p53-listening-stack-fix.yml'
      - 'tools/p53_fix_listening_stack.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply exact listening harness heap fix
        run: python tools/p53_fix_listening_stack.py

      - name: Validate P5.3 contract and diff
        run: |
          python qa/verify_p53_validation.py
          git diff --check

      - name: Commit final fix and remove one-shot machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-p53-listening-stack-fix.yml tools/p53_fix_listening_stack.py
          git add tests/SmartDenoiseListeningHarness.cpp
          git diff --cached --check
          git commit -m 'P5.3: move listening engine off Windows stack'
          git push origin HEAD:agent/ship-v0.3-rc
