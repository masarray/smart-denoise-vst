name: Apply P5.1 advanced geometry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-p51-advanced-geometry.yml'
      - 'tools/apply_p51_advanced_geometry.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ship-v0.3-rc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply P5.1 geometry correction
        run: python tools/apply_p51_advanced_geometry.py
      - name: Validate Concept C, P4 and P5
        run: |
          python qa/verify_concept_c_ui.py
          python qa/verify_p4_visual_fidelity.py
          python qa/verify_p5_ux_integrity.py
          git diff --check
      - name: Commit source/QA only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/apply_p51_advanced_geometry.py
          git add Source/Plugin/PluginEditor.cpp qa/verify_concept_c_ui.py qa/verify_p5_ux_integrity.py CHANGELOG.md
          git diff --cached --check
          git commit -m 'P5.1: make Advanced drawer collision-safe'
          git push origin HEAD:agent/ship-v0.3-rc
