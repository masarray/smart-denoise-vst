name: Apply Smart Denoise hardening patch

on:
  push:
    branches:
      - "agent/**"
    paths:
      - "tools/patches/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Assemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/patches/part* > /tmp/smart-denoise-hardening.patch
          git apply --check --whitespace=nowarn /tmp/smart-denoise-hardening.patch

      - name: Apply hardened source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn /tmp/smart-denoise-hardening.patch
          rm -rf tools/patches

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "smart-denoise-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden Smart Denoise engine, host state and profile UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
